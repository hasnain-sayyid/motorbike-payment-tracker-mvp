services:
  - type: web
    name: motorbike-payment-tracker-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://frontend-blue-seven-42.vercel.app
    healthCheckPath: /health